<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>الصفحة غير موجودة | Digital Pass</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#060F24">

  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/img/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=IBM+Plex+Sans:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Absolute paths: this page is served for any missing address, at any depth -->
  <link rel="stylesheet" href="/assets/css/style.css?v=20261111e">
  <style>
    .nf {
      min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; color: #fff;
      background:
        linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / 72px 72px,
        linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px) 0 0 / 72px 72px,
        var(--deep);
    }
    .nf-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: var(--header-h); }
    .nf-top .lang-toggle { color: #fff; }
    .nf-main { flex: 1; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 24px 0 96px; text-align: center; }
    .nf-code {
      font-family: var(--font-brand); font-size: clamp(110px, 24vw, 200px); font-weight: 700; line-height: 1; letter-spacing: -.04em;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: var(--cyan);
    }
    .nf-title { font-size: clamp(28px, 4.2vw, 42px); font-weight: 700; line-height: 1.3; }
    .nf-text { max-width: 30em; color: rgba(255, 255, 255, .72); }
    .nf-main .btn { margin-top: 18px; }
  </style>
</head>
<body class="nf">
  <header class="container nf-top">
    <a href="/" class="brand brand--light" aria-label="Digital Pass">
      <img class="brand-symbol" src="/assets/img/logo-symbol.svg" alt="" width="25" height="35">
      <span class="wordmark"><span class="wm-digital">DIGITAL</span> <span class="wm-pass">PASS</span></span>
    </a>
    <button class="lang-toggle" type="button" data-lang-toggle lang="en">EN</button>
  </header>

  <main class="container nf-main">
    <p class="nf-code" aria-hidden="true">404</p>
    <h1 class="nf-title" data-t="title">الصفحة غير موجودة</h1>
    <p class="nf-text" data-t="text">ربما تغيّر الرابط أو حُذفت الصفحة. يمكنك العودة إلى الصفحة الرئيسية ومتابعة التصفح.</p>
    <a class="btn btn-light btn-lg" href="/" data-t="home">العودة إلى الرئيسية</a>
  </main>

  <script>
    (function () {
      // Same language choice as the main site (key "dp-lang", or ?lang=en|ar).
      var T = {
        ar: {
          docTitle: "الصفحة غير موجودة | Digital Pass",
          title: "الصفحة غير موجودة",
          text: "ربما تغيّر الرابط أو حُذفت الصفحة. يمكنك العودة إلى الصفحة الرئيسية ومتابعة التصفح.",
          home: "العودة إلى الرئيسية",
          toggle: "EN"
        },
        en: {
          docTitle: "Page not found | Digital Pass",
          title: "Page not found",
          text: "The link may have changed or the page may have been removed. Head back to the homepage to keep browsing.",
          home: "Back to homepage",
          toggle: "ع"
        }
      };
      var KEY = "dp-lang";
      var root = document.documentElement;
      var btn = document.querySelector("[data-lang-toggle]");

      function apply(lang) {
        var t = T[lang];
        root.lang = lang;
        root.dir = lang === "en" ? "ltr" : "rtl";
        document.title = t.docTitle;
        document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t[el.getAttribute("data-t")]; });
        btn.textContent = t.toggle;
        btn.setAttribute("lang", lang === "en" ? "ar" : "en");
      }

      var fromUrl = new URLSearchParams(location.search).get("lang");
      var saved = null;
      try { saved = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
      var current = fromUrl === "en" || fromUrl === "ar" ? fromUrl : saved === "en" ? "en" : "ar";
      apply(current);

      btn.addEventListener("click", function () {
        current = current === "en" ? "ar" : "en";
        apply(current);
        try { localStorage.setItem(KEY, current); } catch (e) { /* storage blocked */ }
      });
    })();
  </script>
</body>
</html>
